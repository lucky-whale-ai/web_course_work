<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Руф Профи — материалы проектирования</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
@font-face{font-family:Golos;src:url('/fonts/Golos_Text_Regular.woff2');font-weight:400}@font-face{font-family:Golos;src:url('/fonts/Golos_Text_Medium.woff2');font-weight:500}
*{box-sizing:border-box}html{scrollbar-width:none}body{margin:0;font:18px/1.5 Golos,Arial,sans-serif;color:#252930;background:#e7e9ee}h1,h2,h3,p{margin:0}h1{font-size:48px;line-height:1.15;font-weight:500}h2{font-size:32px;font-weight:500}h3{font-size:22px;font-weight:500}.board{width:1440px;padding:64px;background:#fff}.intro{max-width:1000px;margin:24px 0 48px;color:#464c5a}.section{margin-top:56px}.grid{display:grid;gap:24px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.photo{height:260px;width:100%;object-fit:cover}.photo.tall{height:380px}.caption{margin-top:12px;font-size:16px;color:#464c5a}.swatch{height:120px}.card{padding:24px;border:1px solid #7a869c}.card h3{margin-bottom:16px}.sample-title{font-size:48px;line-height:56px;font-weight:500}.sample-text{font-size:20px;line-height:28px;margin-top:16px}.red{color:#ab413d}.button{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:16px 32px;background:#ab413d;color:white;font:500 16px/24px Golos;border:0}.button.hover{background:#8c302d}.button.outline{background:white;color:#252930;border:1px solid #7a869c}.button.disabled{opacity:.45}.button.focus{outline:3px solid #5b7bbb;outline-offset:4px}.field{display:grid;gap:8px;font-size:16px}.field input,.field select{width:100%;padding:14px 16px;border:1px solid #7a869c;background:white;font:16px/24px Golos;color:#252930}.field.error input{border-color:#ab413d}.help{font-size:14px;color:#464c5a}.error .help{color:#ab413d}.status{display:inline-block;padding:8px 12px;background:#f1f3f9;font-size:14px}.menu{display:flex;gap:24px;padding:24px;background:#252930;color:white}.active{color:#ab413d}.note{background:#f1f3f9;padding:24px}.muted{color:#7a869c}
.wire-board{width:2720px;padding:32px;background:#e7e9ee}.wire-row{display:flex;gap:32px;align-items:flex-start;margin-top:64px}.wire-caption{font-size:24px;font-weight:500;margin-bottom:16px}.wire-page{background:white;border:2px solid #858b95;padding:24px;display:flex;flex-direction:column;gap:20px}.wire-block{padding:16px;background:#f0f1f3;border:1px solid #949ba5;min-height:64px;font:18px/1.4 Arial,sans-serif;color:#343a43}.wire-block.image{min-height:140px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,transparent 49.85%,#b7bec8 50%,transparent 50.15%),linear-gradient(45deg,transparent 49.85%,#b7bec8 50%,transparent 50.15%),#eceef1}.wire-head{display:flex;justify-content:space-between;gap:16px;min-height:64px;border-bottom:2px solid #858b95;padding:12px}.wire-content{display:grid;gap:16px}.wire-footer{padding:24px;border-top:2px solid #858b95;color:#535b66}.wire-page.mobile{padding:16px;gap:16px}.wire-page.mobile .wire-block{font-size:16px;padding:12px}.wire-page.mobile .wire-head{font-size:16px;padding:0;align-items:center}.wire-page.mobile .wire-content{grid-template-columns:1fr!important}.wire-page.mobile .wire-footer{padding:16px;font-size:16px}
</style></head><body><main id="board"></main>
<script type="module">
const kind=new URLSearchParams(location.search).get('kind')||'concept';const board=document.querySelector('#board');
const colours=[['#ab413d','Акцент, основные действия'],['#5b7bbb','Инженерная графика'],['#252930','Текст и подвал'],['#f1f3f9','Фон карточек']];
const swatches=()=>`<div class="grid four">${colours.map(([c,label])=>`<div><div class="swatch" style="background:${c}"></div><h3>${c}</h3><p class="caption">${label}</p></div>`).join('')}</div>`;
if(kind==='concept'){
 board.className='board';board.innerHTML=`<p class="red">РУФ ПРОФИ / ДИЗАЙН-КОНЦЕПЦИЯ</p><h1>Строительство.<br>Точность. Масштаб.</h1><p class="intro">Корпоративный сайт для заказчиков строительных и инженерных работ. Основа оформления — предоставленный макет Руф Профи: крупная производственная фотография, строгая сетка, спокойная типографика и красный акцент.</p><img class="photo tall" src="/assets/hero.png" alt="Производственный объект"><p class="caption">Референс первого экрана: действующий промышленный объект, крупный заголовок и минимум декоративных элементов.</p><section class="section"><h2>Характер графики</h2><div class="grid four" style="margin-top:24px">${[['oil','Нефтегаз'],['power','Энергетика'],['civil','Гражданские объекты'],['industry','Промышленность']].map(([id,label])=>`<div><img class="photo" src="/assets/sector-${id}.png" alt="${label}"><p class="caption">${label}</p></div>`).join('')}</div></section><section class="section"><h2>Палитра</h2><div style="margin-top:24px">${swatches()}</div></section><section class="section grid two"><div class="note"><h3>Типографика</h3><p class="sample-title">Реализованные<br>объекты</p><p class="sample-text">Golos: Regular для текста, Medium для заголовков и действий. PT Root UI Bold — надпись логотипа.</p></div><div class="note"><h3>Принципы</h3><p class="sample-text">Фотографии показывают предмет деятельности. Карточки собирают данные объекта в одном месте. Ссылки, кнопки и поля сохраняют понятные состояния. Мобильная версия перестраивает колонки и сохраняет читаемый текст.</p></div></section><p class="caption" style="margin-top:40px">Источник направления, фотографий и палитры: исходный файл Figma «РуфПрофи». Это доска анализа выбранного оформления, а не отдельная тема сайта.</p>`;
}else if(kind==='ui'){
 board.className='board';board.innerHTML=`<p class="red">РУФ ПРОФИ / ЭЛЕМЕНТЫ ИНТЕРФЕЙСА</p><h1>Типографика и состояния</h1><p class="intro">Общие элементы страниц, форм и личного кабинета. Повторяющиеся элементы наследуют одну палитру, интервалы и правила доступности.</p>${swatches()}<section class="section"><h2>Текст</h2><p class="sample-title">Заголовок раздела — 48 / 56</p><p class="sample-text">Основной текст — 20 / 28. Вспомогательные подписи — 14 / 20. На мобильном экране кегль и переносы адаптируются к ширине блока.</p></section><section class="section"><h2>Кнопки</h2><div class="grid three" style="margin-top:24px">${[['button','Обычная'],['button hover','Наведение'],['button focus','Клавиатурный фокус'],['button outline','Вторичная'],['button disabled','Недоступна']].map(([cls,label])=>`<div class="card"><button class="${cls}">Отправить</button><p class="caption">${label}</p></div>`).join('')}</div></section><section class="section"><h2>Поля формы</h2><div class="grid two" style="margin-top:24px"><label class="field">Электронная почта *<input placeholder="name@example.test"><span class="help">Обязательное поле отмечено звёздочкой.</span></label><label class="field error">Телефон РБ *<input value="+375"><span class="help">Введите мобильный номер РБ: +375 и 9 цифр.</span></label><label class="field">Направление<select><option>Все направления</option><option>Нефтегазовый сектор</option></select></label><label class="field">Дата рождения *<input type="date"><span class="help">Регистрация доступна с 16 лет.</span></label></div></section><section class="section grid two"><div class="card"><h3>Обращения</h3><p><span class="status">Новое</span> <span class="status">В работе</span> <span class="status">Завершено</span></p><p class="caption">Статус всегда подписан текстом и не зависит только от цвета.</p></div><div class="card"><h3>Избранное</h3><button class="button outline">В избранное</button> <button class="button">В избранном</button><p class="caption">Состояние сохраняется в кабинете пользователя.</p></div></section><section class="section"><h2>Доступность и навигация</h2><p class="sample-text">Видимый фокус, подписи к полям, сообщения об ошибках под полем, закрытие диалога клавишей Escape, мобильное меню и режим текста до 200%.</p><div class="menu" style="margin-top:24px"><span>О компании</span><span>Объекты</span><span>Личный кабинет</span><span>Настройки</span></div></section>`;
}else{
 board.className='wire-board';const pages=[['Главная','home'],['О компании','about'],['Сферы деятельности','services'],['Лицензии','licenses'],['Каталог объектов','projects'],['Карточка объекта','project'],['Охрана труда','safety'],['Контакты','contacts'],['Вход','login'],['Регистрация','register'],['Личный кабинет','account'],['Обработка обращений','admin'],['Настройки','settings'],['Соглашение','agreement'],['Страница 404','404'],['Диалог обращения','request'],['Подтверждение отправки','success']];
 const block=(text,cls='')=>`<div class="wire-block ${cls}">${text}</div>`;const grid=(labels,w,cols=3)=>`<div class="wire-content" style="grid-template-columns:repeat(${w===320?1:w===768?Math.min(2,cols):cols},minmax(0,1fr))">${labels.map(x=>block(x)).join('')}</div>`;
 function content(type,w){switch(type){case 'home':return block('Главное изображение · заголовок · предыдущий / следующий слайд','image')+grid(['Нефтегаз','Энергетика','Гражданское строительство','Промышленность'],w,4)+grid(['11 лет','290 сотрудников','54 объекта'],w)+block('География работ: список регионов и карта')+grid(['Объект: фото, название, данные','Объект: фото, название, данные','Все объекты →'],w)+block('Лицензии: список документов');case 'about':return block('Описание компании')+grid(['Показатели','Команда','Ресурсы'],w)+block('Обращение директора')+block('История компании')+block('Команда и техника','image');case 'services':return grid(['Направление + описание + иллюстрация','Направление + описание + иллюстрация','Направление + описание + иллюстрация','Направление + описание + иллюстрация'],w,2);case 'licenses':return grid(Array(6).fill('Превью документа · название · открыть'),w)+block('Модальное окно: увеличенный документ');case 'projects':return grid(['Поиск','Фильтр','Сортировка'],w)+grid(Array(6).fill('Фото · название · характеристики · избранное'),w)+block('Страницы: 1 · 2 · 3 · 4 · 5');case 'project':return block('Фото объекта','image')+block('Название · направление · сроки · заказчик · регион')+block('Описание выполненных работ')+grid(['Добавить в избранное','Обсудить проект'],w,2);case 'safety':return block('Принципы охраны труда')+grid(['Производственная безопасность','Контроль качества','Обучение персонала'],w)+block('Иллюстрация рабочих процессов','image');case 'contacts':return grid(['Телефон · email · адрес','Карта офиса'],w,2)+grid(['Задать вопрос','Предложить партнёрство'],w,2);case 'login':return block('Email *')+block('Пароль *')+block('Ошибка входа / сообщение')+block('Войти · ссылка на регистрацию');case 'register':return grid(['Фамилия * · имя * · отчество','Дата рождения *','Телефон РБ *','Email *'],w,2)+block('Никнейм · генератор · счётчик попыток')+block('Ручной / автоматический пароль')+grid(['Пароль *','Повтор пароля *'],w,2)+block('Соглашение с прокруткой · подтверждение')+block('Регистрация · ссылка на вход');case 'account':return block('Имя пользователя · выход')+grid(['Избранный объект','Избранный объект','Избранный объект'],w)+block('Мои обращения · статус · новое обращение');case 'admin':return block('Фильтр по статусу')+grid(['Обращение · контакты · смена статуса','Обращение · контакты · смена статуса','Обращение · контакты · смена статуса'],w,1);case 'settings':return grid(['Русский / English','Светлая / тёмная тема','Версия для слабовидящих','Размер текста: 100 / 150 / 200%','Контрастная палитра','Изображения: показать / скрыть'],w,2)+block('Сбросить настройки');case 'request':return block('Диалог · закрыть ×')+block('Имя *')+block('Email * · телефон')+block('Текст обращения *')+block('Согласие на обработку учебных данных')+block('Отправить · ошибка заполнения');case 'success':return block('Диалог · закрыть ×')+block('Сообщение успешно отправлено')+block('Хорошо · возврат к странице');case 'agreement':return block('Назначение учебного сервиса')+block('Учётная запись и данные')+block('Правила обращений и демонстрационные данные');default:return block('404 · Страница не найдена')+block('Вернуться на главную');}}
 board.innerHTML='<h1>Схематичные прототипы страниц</h1><p class="intro">Расположение и назначение блоков. В каждой строке: компьютер 1440 px, планшет 768 px, телефон 320 px. Серые блоки обозначают содержимое и интерактивные области до детальной стилизации.</p>'+pages.map(([title,type])=>`<section class="wire-row">${[1440,768,320].map(w=>`<div style="width:${w}px;flex:none"><h2 class="wire-caption">${title} / ${w}</h2><article class="wire-page ${w===320?'mobile':''}"><header class="wire-head"><span>Логотип</span><span>${w<1024?'Телефон · меню':'Разделы сайта · контакты'}</span></header>${type==='home'?'':block(title+' · навигационная цепочка')}${content(type,w)}<footer class="wire-footer">Контакты · разделы · формы связи · настройки</footer></article></div>`).join('')}</section>`).join('');
}
</script></body></html>
